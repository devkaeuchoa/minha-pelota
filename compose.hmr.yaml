# compose.hmr.yaml — Hot reload de verdade dentro do Docker (opt-in).
# Não é carregado automaticamente pelo `docker compose up` — precisa ser
# passado explicitamente junto com os outros arquivos:
#
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.hmr.yaml up -d
#
# O que isso muda em relação ao compose.override.yaml (modo dev "normal"):
#   - Monta o código PHP (app/, routes/, config/, resources/, database/) como
#     bind mount somente-leitura no container `app`, para que mudanças no
#     backend valham sem rebuild da imagem (vendor/, storage/, bootstrap/cache
#     continuam vindo da imagem, já com dono www-data correto — não são
#     sobrescritos, então não há problema de permissão).
#   - Sobe um serviço `vite` (Node) rodando `npm run dev` com o Vite dev
#     server, escrevendo `public/hot` para o Laravel trocar os assets
#     compilados pelos assets servidos com HMR. Publica a porta 5180 no host.
#   - node_modules do container fica num volume próprio (`vite_node_modules`),
#     sem tocar no node_modules do checkout local.

services:
  app:
    volumes:
      - dev_db:/app/storage/dev
      - ./app:/app/app:ro
      - ./routes:/app/routes:ro
      - ./config:/app/config:ro
      - ./resources:/app/resources:ro
      - ./database:/app/database:ro
      - ./public:/app/public:ro
    command: >
      sh -c "php artisan config:clear &&
             php artisan route:clear &&
             php artisan view:clear &&
             php artisan migrate --force &&
             php-fpm"

  vite:
    image: node:22
    working_dir: /app
    environment:
      VITE_DEV_SERVER_ORIGIN: http://localhost:${VITE_PORT:-5180}
    volumes:
      - .:/app:cached
      - vite_node_modules:/app/node_modules
    ports:
      - "${VITE_PORT:-5180}:5180"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5180 --strictPort"
    networks: [app_net]

volumes:
  vite_node_modules:
